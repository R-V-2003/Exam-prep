<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="tassel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
  </defs>
  
  <!-- Smooth app-icon-like rounded background -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)"/>
  
  <!-- 3D shadow for cap -->
  <path d="M256 120 L464 210 L256 300 L48 210 Z" fill="#000000" opacity="0.15"/>
  
  <!-- Main cap mortarboard diamond -->
  <path d="M256 110 L464 200 L256 290 L48 200 Z" fill="#FFFFFF"/>
  
  <!-- Cap skull portion -->
  <path d="M136 260 V330 C136 370 190 390 256 390 C322 390 376 370 376 330 V260 L256 312 Z" fill="#E2E8F0"/>
  
  <!-- Tassel string and band -->
  <path d="M256 200 C270 200 380 230 380 280" stroke="url(#tassel-grad)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Tassel fringe hanging down -->
  <path d="M380 280 L380 340" stroke="url(#tassel-grad)" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Small button on top of cap -->
  <ellipse cx="256" cy="200" rx="14" ry="10" fill="#FFFFFF"/>
</svg>
